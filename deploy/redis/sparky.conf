# Sparky 3D Craft — Redis settings (included from /etc/redis/redis.conf)
# Never exposed: loopback only, password required.
bind 127.0.0.1 -::1
protected-mode yes
port 6379
requirepass {{REDIS_PASSWORD}}
# BullMQ (event bus, workflow engine) requires noeviction.
maxmemory {{REDIS_MAXMEMORY}}
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
