# Sparky 3D Craft — shared nginx settings (http{} context, conf.d)
limit_req_zone $binary_remote_addr zone=sparky_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sparky_forms:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=sparky_api:10m rate=30r/s;
limit_req_status 429;

map $http_upgrade $sparky_connection_upgrade {
  default upgrade;
  ''      close;
}

upstream sparky_storefront { server 127.0.0.1:3000; keepalive 16; }
upstream sparky_medusa     { server 127.0.0.1:9000; keepalive 16; }

# `gzip on;` is already set by Ubuntu's nginx.conf (duplicate directive otherwise)
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml text/xml;

server_tokens off;
