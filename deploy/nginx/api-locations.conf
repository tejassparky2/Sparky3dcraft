client_max_body_size 25m;

# Razorpay webhooks: no rate limit (provider retries), small bodies only
location = /hooks/razorpay {
  client_max_body_size 256k;
  include /etc/nginx/snippets/sparky-proxy-params.conf;
  proxy_pass http://sparky_medusa;
}

location ^~ /auth/ {
  limit_req zone=sparky_auth burst=10 nodelay;
  include /etc/nginx/snippets/sparky-proxy-params.conf;
  proxy_pass http://sparky_medusa;
}

location ~ ^/store/sparky/(uploads|contact|newsletter)$ {
  limit_req zone=sparky_forms burst=5 nodelay;
  include /etc/nginx/snippets/sparky-proxy-params.conf;
  proxy_pass http://sparky_medusa;
}

location / {
  limit_req zone=sparky_api burst=60 nodelay;
  include /etc/nginx/snippets/sparky-proxy-params.conf;
  proxy_pass http://sparky_medusa;
}

# local product media when FILE_PROVIDER=local (staging only)
location ^~ /static/ {
  include /etc/nginx/snippets/sparky-proxy-params.conf;
  proxy_pass http://sparky_medusa;
  expires 30d;
}
