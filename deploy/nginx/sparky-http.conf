# Sparky 3D Craft — HTTP only (before certificates exist / staging without TLS)
server {
  listen 80;
  listen [::]:80;
  server_name {{STORE_DOMAIN}} www.{{STORE_DOMAIN}};
  include /etc/nginx/snippets/sparky-security-headers.conf;
  location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  include /etc/nginx/snippets/sparky-storefront-locations.conf;
}

server {
  listen 80;
  listen [::]:80;
  server_name {{API_DOMAIN}};
  include /etc/nginx/snippets/sparky-security-headers.conf;
  location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  include /etc/nginx/snippets/sparky-api-locations.conf;
}
