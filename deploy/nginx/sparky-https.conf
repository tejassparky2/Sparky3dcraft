# Sparky 3D Craft — HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name {{STORE_DOMAIN}} www.{{STORE_DOMAIN}} {{API_DOMAIN}};
  location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://$host$request_uri; }
}

server {
  # 'listen ... http2' (not 'http2 on;', which needs nginx >= 1.25.1; Ubuntu 24.04 ships 1.24)
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.{{STORE_DOMAIN}};
  ssl_certificate /etc/letsencrypt/live/{{CERT_NAME}}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{CERT_NAME}}/privkey.pem;
  include /etc/nginx/snippets/sparky-tls.conf;
  return 301 https://{{STORE_DOMAIN}}$request_uri;
}

server {
  # 'listen ... http2' (not 'http2 on;', which needs nginx >= 1.25.1; Ubuntu 24.04 ships 1.24)
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name {{STORE_DOMAIN}};
  ssl_certificate /etc/letsencrypt/live/{{CERT_NAME}}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{CERT_NAME}}/privkey.pem;
  include /etc/nginx/snippets/sparky-tls.conf;
  include /etc/nginx/snippets/sparky-security-headers.conf;
  add_header Strict-Transport-Security "max-age=31536000" always;
  include /etc/nginx/snippets/sparky-storefront-locations.conf;
}

server {
  # 'listen ... http2' (not 'http2 on;', which needs nginx >= 1.25.1; Ubuntu 24.04 ships 1.24)
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name {{API_DOMAIN}};
  ssl_certificate /etc/letsencrypt/live/{{CERT_NAME}}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{CERT_NAME}}/privkey.pem;
  include /etc/nginx/snippets/sparky-tls.conf;
  include /etc/nginx/snippets/sparky-security-headers.conf;
  add_header Strict-Transport-Security "max-age=31536000" always;
  include /etc/nginx/snippets/sparky-api-locations.conf;
}
