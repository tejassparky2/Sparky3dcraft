# Sparky 3D Craft — PostgreSQL 16 settings (installed to conf.d by deploy/scripts/30-database.sh)
# Sized for Oracle Ampere A1: 2 OCPU / 12 GB RAM shared with Medusa, Next.js and Redis.
listen_addresses = 'localhost'
max_connections = 100
shared_buffers = 1GB
effective_cache_size = 4GB
maintenance_work_mem = 256MB
work_mem = 16MB
wal_compression = on
checkpoint_completion_target = 0.9
random_page_cost = 1.1
password_encryption = scram-sha-256
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
